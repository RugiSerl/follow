name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  linux:
    name: Linux (compilation + tests)
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install GTK3 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev pkg-config

      - name: Build
        run: make bin/follow

      - name: Unit tests
        run: make test

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: follow-linux-x86_64
          path: bin/follow
          if-no-files-found: error

  windows:
    name: Windows (cross-compilation)
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      # git est nécessaire pour actions/checkout dans un job conteneurisé.
      - name: Install git
        run: dnf install -y git

      - name: Code checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MinGW / GTK3 cross toolchain
        run: dnf install -y make glib2-devel mingw64-gcc mingw64-gtk3 pkgconf-pkg-config

      - name: Build Windows executable
        run: make windows

      - name: Verify Windows executable
        run: |
          test -s bin/windows/follow.exe
          x86_64-w64-mingw32-objdump -f bin/windows/follow.exe | grep -q "pei-x86-64"

      - name: Build Windows distribution
        run: make windows-dist

      - name: Verify Windows distribution
        run: |
          test -s bin/windows-dist/follow.exe
          test -f bin/windows-dist/libgtk-3-0.dll

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: follow-windows-x86_64
          path: bin/windows-dist
          if-no-files-found: error
